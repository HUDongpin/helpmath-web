name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"
  NEXT_PUBLIC_SITE_URL: https://www.helpmath.ai

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Enforce launch-gate transition history
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        run: npm run check:launch-gate-transition
      - run: npm run check:generated
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:coverage
      - run: npm audit --audit-level=high
      - run: npm run build

  browser-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: mcr.microsoft.com/playwright:v1.61.1-noble@sha256:5b8f294aff9041b7191c34a4bab3ac270157a28774d4b0660e9743297b697e48
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Enforce Chromium, Firefox, and WebKit browser contracts
        run: npm run test:e2e
      - name: Enforce reviewed visual baselines
        run: npm run test:visual
      - name: Retain visual report and public-page failure diffs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-regression-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/playwright-visual
            artifacts/playwright-visual-report/results.xml
          if-no-files-found: error
          retention-days: 30

  lighthouse:
    # Private ubuntu-latest runners have two vCPUs, while this strict mobile
    # performance gate was calibrated on four-core hosted hardware. Pin the
    # standard four-core Intel runner so runner capacity does not masquerade
    # as a product regression. A runner whose per-route median benchmark falls
    # at or below Lighthouse's own slow-host boundary is ineligible. The whole
    # Quality workflow may then be rerun once on a fresh runner; an eligible
    # product-budget failure is never retried.
    runs-on: macos-15-intel
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Authorize Lighthouse workflow attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/lighthouse-rerun
          prior_artifact_dir="$RUNNER_TEMP/lighthouse-attempt-1"
          prior_capacity_path="$prior_artifact_dir/lighthouse-ci/capacity-verdict.json"
          if [[ "$GITHUB_RUN_ATTEMPT" == "2" ]]; then
            gh run download "$GITHUB_RUN_ID" \
              --repo "$GITHUB_REPOSITORY" \
              --name "lighthouse-$GITHUB_RUN_ID-1" \
              --dir "$prior_artifact_dir"
            if [[ ! -f "$prior_capacity_path" ]]; then
              prior_capacity_path="$prior_artifact_dir/capacity-verdict.json"
            fi
            gh api \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/1/jobs?per_page=100" \
              > artifacts/lighthouse-rerun/attempt-1-jobs.json
            for poll_attempt in 1 2 3 4 5 6; do
              gh api \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/2/jobs?per_page=100" \
                > artifacts/lighthouse-rerun/attempt-2-jobs.json
              if node -e \
                "const e=require('./artifacts/lighthouse-rerun/attempt-2-jobs.json'); process.exit(e.jobs?.length === 3 && e.jobs.every(j => Number.isFinite(Date.parse(j.started_at))) ? 0 : 1)"; then
                break
              fi
              if [[ "$poll_attempt" == "6" ]]; then
                echo "All three Quality jobs did not start within the authorization window." >&2
                exit 1
              fi
              sleep 5
            done
          fi
          node scripts/lighthouse-run-policy.mjs authorize-attempt \
            artifacts/lighthouse-rerun \
            "$prior_capacity_path"
      - run: npm run build
      - run: npx playwright install chromium
      - name: Use Playwright Chromium for Lighthouse
        shell: bash
        run: |
          chromium_path="$(node --input-type=module -e "import {chromium} from '@playwright/test'; process.stdout.write(chromium.executablePath())")"
          echo "CHROME_PATH=$chromium_path" >> "$GITHUB_ENV"
      - name: Enforce Lighthouse performance budgets
        id: lighthouse_assertions
        continue-on-error: true
        run: npm run test:lighthouse
      - name: Classify Lighthouse runner capacity
        id: environment
        if: ${{ !cancelled() }}
        run: node scripts/lighthouse-run-policy.mjs classify artifacts/lighthouse-ci
      - name: Enforce eligible Lighthouse verdict
        if: ${{ !cancelled() }}
        env:
          RUNNER_ELIGIBLE: ${{ steps.environment.outputs.eligible }}
          LIGHTHOUSE_ASSERTION_OUTCOME: ${{ steps.lighthouse_assertions.outcome }}
        run: node scripts/lighthouse-run-policy.mjs verdict artifacts/lighthouse-ci
      - name: Retain Lighthouse reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lighthouse-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/lighthouse-ci
            artifacts/lighthouse-rerun
          if-no-files-found: warn
          retention-days: 30
