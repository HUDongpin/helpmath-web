name: Executive preview lifecycle

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      base_url:
        description: Immutable deployment URL to verify (per-deployment Vercel URL, not a branch alias)
        required: false
        type: string
      sha:
        description: Full 40-character commit SHA that the deployment was built from
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: executive-preview-lifecycle-${{ github.event.deployment.id || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment.environment == 'Preview' &&
      github.event.deployment_status.state == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SMOKE_BASE_URL: ${{ github.event.deployment_status.environment_url || inputs.base_url }}
      SMOKE_SHA: ${{ github.event.deployment.sha || inputs.sha }}
    steps:
      - name: Resolve preview URL
        id: target
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_BASE_URL}" ]; then
            echo "::warning title=Smoke skipped::No preview URL available. Lifecycle smoke was NOT run."
            echo "## Executive preview lifecycle: SKIPPED (no preview URL; nothing was verified)" >> "$GITHUB_STEP_SUMMARY"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            probe="$(curl --silent --show-error --output /dev/null --max-time 20 \
              --write-out '%{http_code} %{redirect_url}' "${SMOKE_BASE_URL}")"
            status="${probe%% *}"
            location="${probe#* }"
            echo "Protection probe: HTTP ${status} ${location}"
            if [[ "${status}" == "401" || "${status}" == "403" || "${location}" =~ vercel\.com/sso|/_vercel/sso|vercel\.com/login ]]; then
              echo "::warning title=Smoke skipped::${SMOKE_BASE_URL} is protected (HTTP ${status}). No bypass secret is used, so the lifecycle smoke was NOT run."
              echo "## Executive preview lifecycle: SKIPPED (protected preview, HTTP ${status}; nothing was verified)" >> "$GITHUB_STEP_SUMMARY"
              echo "run=false" >> "$GITHUB_OUTPUT"
            elif ! [[ "${SMOKE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error title=Missing deployment SHA::Pass the full commit SHA the deployment was built from so the smoke contract matches it."
              exit 1
            else
              echo "Smoke target: ${SMOKE_BASE_URL} at ${SMOKE_SHA}"
              echo "run=true" >> "$GITHUB_OUTPUT"
            fi
          fi
      - if: steps.target.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.SMOKE_SHA }}
      - if: steps.target.outputs.run == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - if: steps.target.outputs.run == 'true'
        run: npm ci
      - name: Verify public contract and approved preview lifecycle
        if: steps.target.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          evidence_directory="$RUNNER_TEMP/helpmath-executive-preview-lifecycle"
          mkdir -p "$evidence_directory"
          node scripts/release-smoke.mjs > "$evidence_directory/canonical-contract.json"
          node scripts/check-executive-preview-lifecycle.mjs \
            "$evidence_directory/canonical-contract.json" \
            > "$evidence_directory/lifecycle-observation.json"
      - name: Retain non-secret lifecycle evidence
        if: always() && steps.target.outputs.run == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: executive-preview-lifecycle-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/helpmath-executive-preview-lifecycle
          if-no-files-found: error
          retention-days: 30
