name: Stable external links

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 2"

permissions:
  contents: read

concurrency:
  group: stable-external-links
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Check governed external links
        run: npm run check:stable-links
